# 안드로이드 APK 를 만든다. 이 브랜치에 올릴 때마다 돌고, 결과는 "apk-latest" 릴리스에 올라간다
# (폰에서 그 릴리스의 horizon-angler.apk 를 받아 설치).
name: Android APK
on:
  push:
    branches: [claude/amazing-mendel-8fufxr, main]
    paths: ['src/**', 'assets/game/**', 'assets/fonts/**', 'index.html', 'android/**', 'tools/build_www.mjs', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
# 잇달아 올리면 앞선 빌드는 그만두고 가장 새 것만 만든다 (옛 것이 새 것을 덮어쓰지 않게)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk horizon-angler.apk
      - uses: actions/upload-artifact@v4
        with: { name: horizon-angler-apk, path: horizon-angler.apk }
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "시험용 APK (최신)" --notes "가장 최근에 만든 시험용 APK. 올릴 때마다 자동으로 바뀐다." --target "$GITHUB_SHA"
          gh release upload apk-latest horizon-angler.apk --clobber
