# 윈도우용 PC판을 만든다. 이 브랜치에 올릴 때마다 돌고, 결과는 "pc-latest" 릴리스에 올라간다
# (HorisHorizon.exe = 설치 없이 바로 실행하는 파일, HorisHorizon-windows.zip = 폴더째 묶은 것).
name: Windows PC
on:
  push:
    branches: [claude/amazing-mendel-8fufxr, main]
    paths: ['src/**', 'assets/game/**', 'assets/fonts/**', 'assets/icon-512.png', 'index.html', 'electron/**', 'tools/build_www.mjs', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
# 잇달아 올리면 앞선 빌드는 그만두고 가장 새 것만 만든다 (옛 것이 새 것을 덮어쓰지 않게)
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run pc:win
      - name: Collect
        shell: bash
        run: |
          cp dist-pc/HorisHorizon.exe HorisHorizon.exe
          cp dist-pc/*-win.zip HorisHorizon-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horis-horizon-windows
          path: |
            HorisHorizon.exe
            HorisHorizon-windows.zip
      - name: Publish to the pc-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pc-latest >/dev/null 2>&1 || gh release create pc-latest --prerelease --title "시험용 PC판 (최신)" --notes "가장 최근에 만든 윈도우용 시험판. 올릴 때마다 자동으로 바뀐다." --target "$GITHUB_SHA"
          gh release upload pc-latest HorisHorizon.exe HorisHorizon-windows.zip --clobber
